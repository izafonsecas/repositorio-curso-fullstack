<!DOCTYPE html>
<html lang="pt-br">
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Notícias</title>
  <link rel="stylesheet" href="styles/index.css">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Poppins:wght@400;700&family=Sora:wght@100..800&display=swap" rel="stylesheet">

</head>
<body>
  <header class="container">
    <nav id="primary" class="grid grid-flow-col">
      <div>
        <img src="assets/icon/menu-aberto.png" alt="ícone menu">
        <strong>Menu</strong>
      </div>

      <div>
        <img src="assets/logo/logopq.png" alt="logomarca">
      </div>

      <div>
        <strong>Buscar</strong>
        <img src="assets/icon/lupa.png" alt="ícone lupa">
      </div>
    </nav>

    <nav id="secondary" class="grid grid-flow-col">
      <a href="#">Início</a>
      <a href="#">Notícias</a>
      <a href="#">Agenda</a>
      <a href="#">Turismo</a>
      <a href="#">Gastronomia</a>
      <a href="#">Serviços</a>
    </nav>
</header>

<main class="grid container">
  <section id="featured" class="grid grid-flow-col gap-16">
    <figure class="card">
      <img src="assets/image/IMG_6886.jpg" alt="">

      <figcaption>
        <span class="content-tag">Santarém</span>
        <h2 class="text-2xl">
          Santarém em três cliques: o que fazer, o que está acontecendo e o que vale a visita
        </h2>
      </figcaption>
    </figure>

    <div class="grid grid-cols-2 gap-16">
      <div>
        <img src="assets/image/IMG_4910.jpg" alt="">
      </div>

      <div>
        <img src="assets/image/IMG_5081.jpg" alt="">
      </div>

      <div>
        <img src="assets/image/IMG_5088.jpg" alt="">
      </div>

      <div>
        <img src="assets/image/IMG_5096.jpg" alt="">
      </div>

    </div>
  </section>

</main>
</body>
</html>
