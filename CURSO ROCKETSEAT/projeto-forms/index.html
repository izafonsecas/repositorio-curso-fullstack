<!DOCTYPE html>
<html lang="pt-br">
<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Convites</title>

  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Funnel+Sans:ital,wght@0,300..800;1,300..800&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Poppins:wght@400;700&family=Sora:wght@100..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/index.css">
</head>
<body>
  <h1>Gerador de Convites</h1>
  <p>Preencha os campos abaixo para criar seu convite personalizado </p>

  <form>
    <div>
     <label for="titulo">Título do evento</label>
     <input type="text" id="titulo " name="titulo" placeholder="Ex: Aniversário da Maria" required>
    </div>

    <div>
      <label for="data-inicio">Data de início</label>
      <input type="date" id="data-inicio" name="data-inicio" required>
    </div>

    <div>
      <label for="data-fim">Data de fim</label>
      <input type="date" id="data-fim" name="data-fim" required>
    </div>

    <div>
      <label for="tipo">Tipo do evento</label>
      <select id="tipo" name="tipo" required>
        <option value="">Selecione uma opção</option>
        <option value="presencial">Presencial</option>
        <option value="online">Online</option>
      </select>
    </div>

    <div>
      <label for="local">Local</label>
      <input type="text" id="local" name="local" placeholder="Ex: Rua 1, MG">
    </div>

    <div>
      <label for="descricao">Descrição do evento</label>
      <textarea id="descricao" name="descricao" rows="5" placeholder="Conte um pouco sobre o evento..." required></textarea>
    </div>

    <div>
      <label for="imagem">Imagem de capa</label>
      <input type="file" id="imagem" name="imagem" accept="image/*">
    </div>

    <div>
      <label for="email">E-mail de contato</label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required>
    </div>

    <div>
      <label for="telefone">Telefone de contato</label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
    </div>

    <div>
      <label for="cor-principal">Cor principal</label>
      <input type="color" id="cor-principal" name="cor-principal" value="#7c3aed">
    </div>

    <div>
      <label for="tema">Tema do convite</label>
      <select id="tema" name="tema" required>
        <option value="">Selecione um tema</option>
        <option value="moderno">Moderno</option>
        <option value="classico">Clássico</option>
        <option value="infantil">Infantil</option>
        <option value="minimalista">Minimalista</option>
      </select>
    </div>

    <div>
      <label for="estilo">Estilo</label>
      <select id="estilo" name="estilo" required>
        <option value="claro">Claro</option>
        <option value="escuro">Escuro</option>
      </select>
    </div>

    <button type="submit">Gerar Convite</button>

    </form> 
</body>
</html>
