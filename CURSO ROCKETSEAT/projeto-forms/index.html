<!DOCTYPE html>
<html lang="pt-br">
<head>
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Convites</title>

  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>
  <h1>Gerador de Convites</h1>
  <p>Preencha os campos abaixo para criar seu convite personalizado </p>

  <form>
    <div class="form-section">
      <h2 class="section-title">
        <i class="fa-solid fa-calendar"></i>
        Sobre o evento
      </h2>
      </div>

     <label for="titulo">Título do evento <span class="obrigatorio">*</span>
     <input type="text" id="titulo " name="titulo" placeholder="Ex: Aniversário da Maria" required>
    </div>

    <div class="form-row">
    <div>
      <label for="data-inicio">Data de início <span class="obrigatorio">*</span></label>
      <input type="date" id="data-inicio" name="data-inicio" required>
    </div>

    <div>
      <label for="data-fim">Data de fim <span class="obrigatorio">*</span></label>
      <input type="date" id="data-fim" name="data-fim" required>
    </div>
  </div>

  <div class="form-row">
    <div>
      <label>Tipo do evento <span class="obrigatorio">*</span></label>
      <div class="tipo-opcoes">
        <input type="radio" name="tipo" id="tipo-presencial" value="presencial" checked>
        <label for="tipo-presencial" class="tipo-botao">
          <i class="fa-solid fa-location-dot"></i>
          Presencial
        </label>

         <input type="radio" name="tipo" id="tipo-online" value="online">
        <label for="tipo-online" class="tipo-botao">
          <i class="fa-solid fa-video"></i>
          Online
        </label>
      </div>
    </div>

    <div>
      <label for="local">Local</label>
      <input type="text" id="local" name="local" placeholder="Ex: Rua 1, MG">
    </div>
  </div>

    <div>
      <label for="descricao">Descrição do evento <span class="obrigatorio">*</span></label>
      <textarea id="descricao" name="descricao" rows="5" placeholder="Conte um pouco sobre o evento..." required></textarea>
    </div>
  </div>

  <div class="form-section">
    <h2 class="section-title">
      <i class="fa-solid fa-palette"></i>
      Personalização
    </h2>

    <div>
      <label>Cor principal</label>
      <div class="cor-opcoes">
      <input type="radio"  name="cor-principal" id="cor-azul" value="#3b82f6">
      <label for="cor-azul" class="cor-opcao" style="background-color: #3b82f6;"></label>

      <input type="radio"  name="cor-principal" id="cor-indigo" value="#6366f1">
      <label for="cor-indigo" class="cor-opcao" style="background-color: #6366f1;"></label>

      <input type="radio"  name="cor-principal" id="cor-roxo" value="#8b5cf6">
      <label for="cor-roxo" class="cor-opcao" style="background-color: #8b5cf6;"></label>

      <input type="radio"  name="cor-principal" id="cor-rosa" value="#ec4899">
      <label for="cor-rosa" class="cor-opcao" style="background-color: #ec4899;"></label>

      <input type="radio"  name="cor-principal" id="cor-vermelho" value="#ef4444">
      <label for="cor-vermelho" class="cor-opcao" style="background-color: #ef4444;"></label>

      <input type="radio"  name="cor-principal" id="cor-laranja" value="#f97316">
      <label for="cor-laranja" class="cor-opcao" style="background-color: #f97316;"></label>

      <input type="radio"  name="cor-principal" id="cor-amarelo" value="#eab308">
      <label for="cor-amarelo" class="cor-opcao" style="background-color: #eab308;"></label>

      <input type="radio" name="cor-principal" id="cor-verde" value="#22c55e">
      <label for="cor-verde" class="cor-opcao" style="background-color: #22c55e;"></label>

      <input type="radio" name="cor-principal" id="cor-teal" value="#14b8a6">
      <label for="cor-teal" class="cor-opcao" style="background-color: #14b8a6;"></label>

      <input type="radio" name="cor-principal" id="cor-ciano" value="#06b6d4">
      <label for="cor-ciano" class="cor-opcao" style="background-color: #06b6d4;"></label>

    </div>
</div>

    <div>
      <label for="tema">Tema do convite <span class="obrigatorio">*</span></label>
      <div class="tema-grid">
        <input type="radio" name="tema" id="tema-aniversario" value="aniversario" checked>
        <label for="tema-aniversario" class="tema-opcao">
          <img src="image/aniversario.jpg" alt="Aniversário">
          <span>Aniversário</span>
        </label>
     
        <input type="radio" name="tema" id="tema-infantil" value="infantil" checked>
        <label for="tema-infantil" class="tema-opcao">
          <img src="image/infantil.jpg" alt="Infantil">
          <span>Infantil</span>
        </label>

        <input type="radio" name="tema" id="tema-formatura" value="formatura" checked>
        <label for="tema-formatura" class="tema-opcao">
          <img src="image/formatura.jpg" alt="Formatura">
          <span>Formatura</span>
        </label>

        <input type="radio" name="tema" id="tema-casamento" value="casamento" checked>
        <label for="tema-casamento" class="tema-opcao">
          <img src="image/casamento.jpg" alt="Casamento">
          <span>Casamento</span>
        </label>
    </div>
</div>

    <div class="form-row">
      <div>
      <label>Estilo<span class="obrigatorio">*</span></label>
      <div class="toggle-wrapper">
        <input type="checkbox" id="estilo" name="estilo">
        <label for="estilo" class="toggle">
          <span class="toggle-slider"></span>
          <span class="toggle-text">Escuro</span>
        </label>
      </div>
    </div>

    <div>
      <label for="imagem">Imagem de capa</label>
      <input type="file" id="imagem" name="imagem" accept="image/*">
    </div>
    </div>
  </div>

    <div class="form-section">
      <h2 class="section-title">
        <i class="fa-solid fa-address-card"></i>
        Dados para contato
      </h2>

    <div>
    <label for="nome">Nome</label>
    <input type="text" id="nome" name="nome" placeholder="Nome completo" required>
  </div>

  <div class="form-row">
    <div>
      <label for="email">E-mail de contato <span class="obrigatorio">*</span></label>
      <input type="email" id="email" name="email" placeholder="seu@email.com" required>
    </div>

    <div>
      <label for="telefone">Telefone de contato <span class="obrigatorio">*</span></label>
      <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
    </div>
  </div>
</div>

<div class="consent-block">
    <label class="checkbox-option">
        <input type="checkbox" name="termos" required>
        <span class="checkbox-mark"></span>
        <span>Li e concordo com os <a href="#">Termos e Condições</a> e com a <a href="#">Política de Privacidade</a></span>
    </label>

    <label class="checkbox-option">
        <input type="checkbox" name="promo-email">
        <span class="checkbox-mark"></span>
        <span>Aceito receber atualizações e promoções por e-mail</span>
    </label>

    <label class="checkbox-option">
        <input type="checkbox" name="promo-sms">
        <span class="checkbox-mark"></span>
        <span>Aceito receber atualizações e promoções por SMS</span>
    </label>
</div>

    <button type="submit">
      <i class="fa-solid fa-calendar-check"></i>
      Gerar Convite</button>

    </form> 
</body>
</html>
